name: OpsBeacon Cloud CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Build test image
        run: docker build --target test -t opsbeacon:test .
      - name: Check fatal lint errors
        run: docker run --rm opsbeacon:test python -m flake8 app/ tests/ --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests
        run: docker run --rm opsbeacon:test
  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/opsbeacon:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/opsbeacon:${{ github.sha }}
